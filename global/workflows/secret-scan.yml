# Secret scanning for every push and pull request.
#
# `global/instructions/00-security-governance.md` tells the model never to
# hardcode a secret. This is the backstop for when it (or a human) does it
# anyway: gitleaks scans the diff for API keys, tokens, and credentials before
# they land on a branch anyone can read.
#
# Alternative: Betterleaks. Gitleaks' own author has since released Betterleaks
# as its faster, lower-noise successor (same rule/config format, so it's a
# near drop-in swap). It ships only as a third-party-maintained action
# (`dortort/betterleaks-action`, not published under a `betterleaks` org),
# which is why this kit still defaults to the `gitleaks` org's own action —
# read `dortort/betterleaks-action` in full before vendoring it, per this
# file's own review bar. To switch, replace the `gitleaks` step below with:
#
#   - uses: dortort/betterleaks-action@v0.1.0
#     with:
#       github-token: ${{ secrets.GITHUB_TOKEN }}
#
# and drop the `pull-requests: write` permission below, which is gitleaks-
# action-specific (Betterleaks reports via job summary / SARIF instead of a
# PR comment).

name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action posts findings as a pull request comment; without this it
  # can only write the job summary and logs.
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full history of a push/PR range, not just the
          # tip commit, so a secret can't slip through buried a commit deep.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
