# Secret scanning for every push and pull request.
#
# `global/instructions/00-security-governance.md` tells the model never to
# hardcode a secret. This is the backstop for when it (or a human) does it
# anyway: gitleaks scans the diff for API keys, tokens, and credentials before
# they land on a branch anyone can read.

name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action posts findings as a pull request comment; without this it
  # can only write the job summary and logs.
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full history of a push/PR range, not just the
          # tip commit, so a secret can't slip through buried a commit deep.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
