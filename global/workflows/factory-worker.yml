# Ember-style software factory — the worker.
#
# Runs exactly one admitted issue, under a turn allowance and a wall-clock
# deadline, then records the outcome in the ledger. It is dispatched by the
# conductor, never scheduled: admission control is the conductor's job, and a
# worker that could start itself would route around the governor.
#
# The one rule this file exists to enforce: **nothing here merges itself.** The
# worker opens a pull request or escalates to a human. Both are terminal; there
# is no third outcome where work silently lands.

name: Factory Worker

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to work"
        required: true
        type: string
      task_class:
        description: "mechanical | standard | deep"
        required: false
        default: standard
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  # claude-code-action mints its own GitHub token via OIDC token exchange even
  # under claude_code_oauth_token auth; without this the step fails with
  # "Could not fetch an OIDC token".
  id-token: write

jobs:
  work:
    # Runner comes from the repo variable FACTORY_RUNNER, not .factory.json —
    # `runs-on` is evaluated before any step can read a file. Set it to a JSON
    # string (`"ubuntu-latest"`) or a JSON array for a self-hosted pool
    # (`["self-hosted","nas","factory"]`) to keep the work on your own hardware.
    runs-on: ${{ fromJSON(vars.FACTORY_RUNNER || '"ubuntu-latest"') }}
    env:
      # ── Billing guard ───────────────────────────────────────────────────
      # This factory is meant to run on a Claude *subscription*, never at API
      # rates. claude-code-action resolves its key as
      # `inputs.anthropic_api_key || env.ANTHROPIC_API_KEY` (action.yml), so an
      # ANTHROPIC_API_KEY present in the environment is forwarded into the run
      # even though this workflow never passes one — and a self-hosted runner
      # inherits its host's environment, where such a key may well exist for
      # something else entirely. Pinning it empty at job scope means the only
      # credential that can reach the run is the OAuth token below.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preflight — subscription credential and runner
        id: preflight
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_OAUTH" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. The factory runs on a Claude subscription, not API credit." >&2
            echo "Generate one with \`claude setup-token\` and add it as a repository secret." >&2
            exit 1
          fi
          REQUIRE_SELF_HOSTED="$(node -p "require('./.factory/factory.config.json').require_self_hosted === true || (require('fs').existsSync('.factory.json') && require('./.factory.json').require_self_hosted === true)")"
          if [ "$REQUIRE_SELF_HOSTED" = "true" ] && [ "${{ runner.environment }}" != "self-hosted" ]; then
            echo "::error::require_self_hosted is on, but this job landed on a ${{ runner.environment }} runner." >&2
            echo "Set the FACTORY_RUNNER repository variable to your runner labels, e.g. [\"self-hosted\",\"nas\",\"factory\"]." >&2
            exit 1
          fi
          echo "auth: subscription (OAuth) · runner: ${{ runner.environment }}"

      - name: Resolve caps for this task class
        id: caps
        env:
          TASK_CLASS: ${{ inputs.task_class }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { loadConfig } from './.factory/scripts/ledger.mjs';
            const c = loadConfig();
            const cls = process.env.TASK_CLASS || 'standard';
            const spec = (c.admission.task_classes || {})[cls] || {};
            console.log([
              'max_turns=' + (spec.max_turns ?? c.admission.max_turns),
              'deadline_minutes=' + (spec.deadline_minutes ?? c.admission.deadline_minutes),
              'escalated_label=' + c.queue.escalated_label,
              'in_flight_label=' + c.queue.in_flight_label,
              'allowed=' + (c.admission.allowed_task_classes || []).includes(cls),
            ].join('\n'));
          " >> "$GITHUB_OUTPUT"

      - name: Refuse a task class this repo has not enabled
        if: steps.caps.outputs.allowed != 'true'
        run: |
          echo "Task class '${{ inputs.task_class }}' is not in allowed_task_classes." >&2
          exit 1

      - name: Configure git identity
        run: |
          git config user.name "factory-worker"
          git config user.email "factory-worker@users.noreply.github.com"

      - name: Fetch the issue
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
            });
            core.setOutput('title', data.title);
            core.setOutput('body', data.body || '');
            core.setOutput('labels', data.labels.map((l) => (typeof l === 'string' ? l : l.name)).join(', '));

      # ── Host capacity ───────────────────────────────────────────────────
      # `wip_limit` counts factory work only. This box also runs CI, a Docker
      # swarm, and whatever else it is for, so capacity is asked of the machine
      # itself. A busy host DEFERS: the claim is released, the issue returns to
      # the queue untouched, and nothing is escalated — being busy is not a
      # failure and must not cost the issue its budget or a human's attention.
      - name: Host capacity check
        id: host
        run: node .factory/scripts/hostcheck.mjs

      - name: Defer — host is busy
        if: steps.host.outputs.ok != 'true'
        run: |
          echo "::notice::Deferring #${{ inputs.issue_number }} — ${{ steps.host.outputs.reason }}"
          node .factory/scripts/factory.mjs release --issue "${{ inputs.issue_number }}"
          echo "### Deferred: host busy" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.host.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      # Project setup. Deliberately best-effort and non-fatal: a repo with no
      # package.json is not a broken factory, and a failed install should reach
      # Claude as context to work around rather than kill the run before it
      # starts. What the run must NOT do is claim tests passed when the tooling
      # was never there — the skill's reporting rules cover that.
      - name: Install dependencies
        id: deps
        if: steps.host.outputs.ok == 'true'
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          else echo "no package.json — skipping"; fi

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.host.outputs.ok == 'true' 
        timeout-minutes: ${{ fromJSON(steps.caps.outputs.deadline_minutes) }}
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The conductor dispatches this workflow with GITHUB_TOKEN, so the
          # triggering actor is `github-actions[bot]` — and claude-code-action
          # refuses a non-human actor by default ("Workflow initiated by
          # non-human actor"). That default is an injection guard for the
          # comment-triggered flows the action was built for, where a bot
          # comment would otherwise carry a prompt. A machine dispatching a
          # machine IS this factory's architecture, so the guard has to be
          # opened — but only for the one bot that does the dispatching.
          #
          # Never `'*'`: the action's own docs warn that on a public repo it
          # lets external Apps invoke the run with prompts they control. Here
          # the prompt is built below from the issue, and `workflow_dispatch`
          # already requires repo write access to trigger.
          allowed_bots: "github-actions"
          # Without the full transcript a run that "succeeds" but does nothing is
          # undiagnosable — you cannot tell a permission denial from a model that
          # decided there was nothing to do.
          show_full_output: true
          claude_args: |
            --max-turns ${{ steps.caps.outputs.max_turns }}
          prompt: |
            You are the Factory Worker, running unattended on a schedule. No
            human has reviewed a plan first, and no human is watching this run.

            REPO:       ${{ github.repository }}
            ISSUE:      #${{ inputs.issue_number }} — ${{ steps.issue.outputs.title }}
            LABELS:     ${{ steps.issue.outputs.labels }}
            TASK CLASS: ${{ inputs.task_class }}
            ALLOWANCE:  ${{ steps.caps.outputs.max_turns }} turns, ${{ steps.caps.outputs.deadline_minutes }} minutes
            DEPS:       ${{ steps.deps.outcome }}

            ISSUE BODY:
            ${{ steps.issue.outputs.body }}

            Follow the `factory-task` skill in `.claude/skills/factory-task/`.
            It is the procedure for this run: how to scope the work, what to do
            when the issue turns out to be wrong, what the two terminal outcomes
            are, and what you must record before you finish.

            The rules that are never negotiable, restated here because this
            prompt is the one thing you are guaranteed to read:

            1. You do not merge anything. Open a pull request, or escalate.
            2. If the work does not fit the allowance, escalate with what you
               learned. A partial pull request is worse than none.
            3. Never weaken a test to get green. If a test is wrong, say so in
               the pull request and explain why.
            4. Report honestly. If you could not run the tests or the linter,
               say that in the pull request body. Never imply a check passed
               that you did not run.

      - name: Record the outcome
        if: always() && steps.host.outputs.ok == 'true' 
        env:
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          # `landed` here means the run produced a pull request for a human, not
          # that anything merged. The ledger records what the factory did; the
          # merge decision stays with the reviewer.
          case "$OUTCOME" in
            success) RESULT=landed ;;
            *)       RESULT=failed ;;
          esac
          EXEC_FILE="${{ steps.claude.outputs.execution_file }}"
          node .factory/scripts/factory.mjs record \
            --issue "${{ inputs.issue_number }}" \
            --run-id "${{ github.run_id }}" \
            --outcome "$RESULT" \
            ${EXEC_FILE:+--execution-file "$EXEC_FILE"}

      - name: Clear the in-flight label
        if: always()
        uses: actions/github-script@v7
        env:
          IN_FLIGHT_LABEL: ${{ steps.caps.outputs.in_flight_label }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number('${{ inputs.issue_number }}'),
                name: process.env.IN_FLIGHT_LABEL,
              });
            } catch (error) {
              if (error.status !== 404) throw error; // already gone is fine
            }

      # A failed run that says nothing is the worst outcome: the issue looks
      # untouched, the next tick re-admits it, and the loop burns the budget on
      # the same failure forever. The escalation label is what breaks that cycle.
      - name: Escalate a failed run
        # A DEFERRED run is not a failed one. The host-busy path above released
        # the claim and left the issue in the queue for the next tick; but the
        # `claude` step is then `skipped`, which also satisfies `!= 'success'`.
        # Without the host guard a transient load spike would label the issue
        # `factory:escalated` and permanently remove it from the queue — the
        # exact opposite of deferring it.
        if: steps.host.outputs.ok == 'true' && steps.claude.outcome != 'success'
        uses: actions/github-script@v7
        env:
          ESCALATED_LABEL: ${{ steps.caps.outputs.escalated_label }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
        with:
          script: |
            const issue_number = Number('${{ inputs.issue_number }}');
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // An empty execution_file means the action exited before Claude
            // took a single turn. That distinction is the whole diagnosis: it
            // separates "the model could not do this task" from "this run was
            // never able to start", and without it every escalation reads the
            // same and costs the reader a log dig. The first real run of this
            // factory was the second kind.
            const started = Boolean(process.env.EXECUTION_FILE);
            const diagnosis = started
              ? 'Claude started and the run ended without a pull request — see the transcript in the run log.'
              : 'Claude never took a turn: the action exited before the first one. That is a workflow, credential or permission problem rather than a task the model could not do — read the `anthropics/claude-code-action` step in the run log, not the transcript.';
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo, issue_number,
              labels: [process.env.ESCALATED_LABEL],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number,
              body: [
                '**Factory run did not complete.**',
                '',
                `Task class \`${{ inputs.task_class }}\` — allowance ${{ steps.caps.outputs.max_turns }} turns / ${{ steps.caps.outputs.deadline_minutes }} minutes.`,
                `Run log: ${url}`,
                `Dependency install: \`${process.env.DEPS_OUTCOME || 'n/a'}\``,
                '',
                diagnosis,
                '',
                `Labelled \`${process.env.ESCALATED_LABEL}\` so the conductor stops re-admitting it. Remove the label to put it back in the queue.`,
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });

      # A run that escalated must not report green. `claude` is
      # `continue-on-error: true` so the ledger, label and escalation steps
      # always get to run — which left a total failure showing as a ✅ in the
      # Actions list. The first real run of this factory was diagnosed as "no
      # failed jobs" while having done precisely nothing, so this is the step
      # that makes the Actions tab tell the truth.
      #
      # Deliberately last, and deliberately after the escalation: the issue is
      # already labelled and commented by the time the job goes red, so failing
      # here costs no recovery.
      - name: Fail the job when the run did not complete
        if: steps.host.outputs.ok == 'true' && steps.claude.outcome != 'success'
        run: |
          echo "::error::Factory run for #${{ inputs.issue_number }} did not complete; the issue has been escalated."
          exit 1
